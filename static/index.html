<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSphere — Secure Credential Manager</title>
  <style>
    :root {
      --bg-gradient:  linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --surface:      #1e293b;
      --surface-card: #0f172a;
      --border:       #334155;
      --border-focus: #6366f1;
      
      --accent:       #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow:  rgba(99, 102, 241, 0.25);
      
      --danger:       #f43f5e;
      --danger-hover: #e11d48;
      
      --text:         #f8fafc;
      --muted:        #94a3b8;
      
      --mono:         'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace;
      --sans:         'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      --vw: #f43f5e;
      --w:  #fb923c;
      --m:  #facc15;
      --s:  #10b981;
      --vs: #06b6d4;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      gap: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.5rem;
      width: 100%;
      max-width: 560px;
    }

    header h1 {
      font-family: var(--mono);
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    header p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 0.2rem;
      font-weight: 500;
    }

    .logout-btn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 0.85rem;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: var(--danger);
      color: white;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
      transform: translateY(-1px);
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.4rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 560px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.88rem;
      padding: 0.65rem 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      border-radius: 8px;
      text-align: center;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .panel { display: none; flex-direction: column; gap: 1.25rem; }
    .panel.active { display: flex; }

    label {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .field { display: flex; flex-direction: column; gap: 0.5rem; }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="email"] {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 0.8rem 1rem;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
      border-radius: 8px;
    }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .pwd-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .pwd-row input { flex: 1; }

    .btn {
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.8rem 1.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
      border-radius: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn.danger {
      background: var(--danger);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.25);
    }

    .btn.danger:hover {
      background: var(--danger-hover);
    }

    .btn.full { width: 100%; }
    .btn.icon { padding: 0.7rem; font-size: 1rem; min-width: 42px; }

    .strength-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .strength-bar {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .strength-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
      width: 0;
    }

    .strength-label {
      font-family: var(--mono);
      font-size: 0.78rem;
      min-width: 85px;
      text-align: right;
      font-weight: 700;
    }

    .suggestions {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .suggestions li {
      font-size: 0.85rem;
      color: var(--muted);
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.6rem 0.8rem 0.6rem 2rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .suggestions li::before {
      content: "✓";
      position: absolute;
      left: 0.75rem;
      color: var(--accent);
      font-weight: 800;
    }

    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .vault-header h2 { font-size: 1.1rem; color: var(--text); font-weight: 700; }

    .vault-list { display: flex; flex-direction: column; gap: 0.8rem; }

    .vault-entry {
      background: var(--surface-card);
      border: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .vault-entry:hover {
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .vault-entry-info { flex: 1; min-width: 0; }

    .vault-entry-user {
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .vault-badge {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .vault-entry-pwd {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.05em;
      margin-top: 0.2rem;
    }

    .vault-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 2.5rem 0;
      font-style: italic;
    }

    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      background: var(--surface);
      border: 1px solid var(--accent);
      padding: 0.75rem 1.5rem;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 99;
      white-space: nowrap;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      color: var(--text);
      font-weight: 600;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .slider-val {
      font-family: var(--mono);
      font-size: 0.98rem;
      min-width: 28px;
      text-align: right;
      font-weight: 700;
      color: #818cf8;
    }

    @media only screen and (max-width: 37.5em) {
      body { padding: 1.5rem 1rem 2rem; }
      header h1 { font-size: 1.6rem; }
      .card { padding: 1.25rem; }
      .tabs { flex-wrap: wrap; }
      .tab-btn { padding: 0.5rem; font-size: 0.82rem; }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>CyberSphere</h1>
    <p>Set and Secure your credentials!</p>
  </div>
  <button class="logout-btn" id="logout-btn" title="Log out and clear session">Log out</button>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="generate">Generate</button>
  <button class="tab-btn"        data-tab="review">Review</button>
  <button class="tab-btn"        data-tab="vault">DigiSafe</button>
</div>

<div class="card">

  <div class="panel active" id="tab-generate">
    <div class="field">
      <label>Password length</label>
      <div class="slider-row">
        <input type="range" id="gen-length" min="8" max="40" value="12" />
        <span class="slider-val" id="gen-length-val">12</span>
      </div>
    </div>

    <button class="btn full" id="gen-btn">Generate password</button>

    <div class="field" id="gen-result-block" style="display:none">
      <label>Generated password</label>
      <div class="pwd-row">
        <input type="text" id="gen-output" readonly />
        <button class="btn icon" id="gen-copy" title="Copy">⎘</button>
      </div>
      <div class="strength-row">
        <div class="strength-bar"><div class="strength-bar-fill" id="gen-bar"></div></div>
        <span class="strength-label" id="gen-strength-lbl"></span>
      </div>
    </div>

    <div id="gen-save-block" style="display:none">
      <div class="field">
        <label>Store in DigiSafe — app / service</label>
        <input type="text" id="gen-app" placeholder="e.g. GitHub, Netflix" />
      </div>
      <button class="btn full" id="gen-save-btn">Store in DigiSafe</button>
    </div>
  </div>

  <div class="panel" id="tab-review">
    <div class="field">
      <label>Your password</label>
      <input type="text" id="rev-input" placeholder="Paste or type a password…" />
    </div>

    <button class="btn full" id="rev-btn">Check strength</button>

    <div id="rev-result-block" style="display:none">
      <div class="field">
        <div class="strength-row">
          <div class="strength-bar"><div class="strength-bar-fill" id="rev-bar"></div></div>
          <span class="strength-label" id="rev-strength-lbl"></span>
        </div>
      </div>
      <ul class="suggestions" id="rev-suggestions"></ul>
    </div>

    <div id="rev-save-block" style="display:none">
      <div class="field">
        <label>App / service</label>
        <input type="text" id="rev-app" placeholder="e.g. Netflix, Slack" />
      </div>
      <button class="btn full" id="rev-save-btn">Store in DigiSafe</button>
    </div>
  </div>

  <div class="panel" id="tab-vault">
    <div class="vault-header">
      <h2>Saved passwords</h2>
      <button class="btn" id="vault-refresh-btn">↺ Refresh</button>
    </div>
    <div class="vault-list" id="vault-list">
      <p class="vault-empty">Loading…</p>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
  function toast(msg, duration = 2400) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), duration);
  }

  const STRENGTH_CONFIG = {
    "Very Weak":  { pct: 12,  color: "var(--vw)" },
    "Weak":       { pct: 30,  color: "var(--w)"  },
    "Medium":     { pct: 55,  color: "var(--m)"  },
    "Strong":     { pct: 78,  color: "var(--s)"  },
    "Very Strong":{ pct: 100, color: "var(--vs)" },
  };

  function applyStrength(bar, label, strength) {
    const cfg = STRENGTH_CONFIG[strength] || STRENGTH_CONFIG["Very Weak"];
    bar.style.width      = cfg.pct + "%";
    bar.style.background = cfg.color;
    label.textContent    = strength;
    label.style.color    = cfg.color;
  }

  let currentUserEmail = "";
  let currentUserId = null;
  let isAuthenticated = false;

  async function api(path, opts = {}) {
    const res = await fetch(path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (res.status === 403 || res.status === 401) {
        window.location.href = "/login";
        return;
      }
      throw new Error(err.error || "Request failed");
    }
    return res.json();
  }

  async function initApp() {
    try {
      const me = await api("/api/me").catch(() => null);
      if (!me || !me.loggedIn) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "/login";
        return;
      }
      currentUserEmail = me.email || "";
      currentUserId = me.userId || null;
      isAuthenticated = true;
    } catch (e) {
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = "/login";
    }
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "vault") {
        loadVault();
      }
    });
  });

  initApp();

  async function logout() {
    try {
      localStorage.clear();
      sessionStorage.clear();
      document.querySelectorAll("input[type='text'], input[type='password']").forEach(el => el.value = "");
      await api("/api/logout", { method: "POST" });
    } catch (e) {
      console.error("Logout error:", e);
    } finally {
      isAuthenticated = false;
      currentUserEmail = "";
      currentUserId = null;
      window.location.href = "/login";
    }
  }

  document.getElementById("logout-btn").addEventListener("click", logout);

  window.addEventListener("pageshow", (event) => {
    if (event.persisted) {
      initApp();
    }
  });

  const lenSlider = document.getElementById("gen-length");
  const lenVal    = document.getElementById("gen-length-val");
  lenSlider.addEventListener("input", () => lenVal.textContent = lenSlider.value);

  document.getElementById("gen-btn").addEventListener("click", async () => {
    try {
      const data = await api(`/api/generate?length=${lenSlider.value}`);
      document.getElementById("gen-output").value = data.password;
      applyStrength(
        document.getElementById("gen-bar"),
        document.getElementById("gen-strength-lbl"),
        data.strength
      );
      document.getElementById("gen-result-block").style.display = "";
      document.getElementById("gen-save-block").style.display   = "";
    } catch (e) { toast("⚠ " + e.message); }
  });

  document.getElementById("gen-copy").addEventListener("click", () => {
    const pwd = document.getElementById("gen-output").value;
    if (!pwd) return;
    navigator.clipboard.writeText(pwd).then(() => toast("Copied to clipboard"));
  });

  document.getElementById("gen-save-btn").addEventListener("click", async () => {
    const app = document.getElementById("gen-app").value.trim();
    const password = document.getElementById("gen-output").value;
    if (!app) { toast("Enter the app or service name."); return; }
    try {
      await api("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: app, password, app }),
      });
      toast("✓ Saved to DigiSafe");
      document.getElementById("gen-app").value = "";
    } catch (e) { toast("⚠ " + e.message); }
  });

  document.getElementById("rev-btn").addEventListener("click", async () => {
    const password = document.getElementById("rev-input").value;
    if (!password) { toast("Enter a password to review."); return; }
    try {
      const data = await api("/api/review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      applyStrength(
        document.getElementById("rev-bar"),
        document.getElementById("rev-strength-lbl"),
        data.strength
      );
      const ul = document.getElementById("rev-suggestions");
      ul.innerHTML = data.suggestions.length
        ? data.suggestions.map(s => `<li>${s}</li>`).join("")
        : `<li style="color:var(--vs)">Looks good — no improvements needed.</li>`;
      document.getElementById("rev-result-block").style.display = "";
      document.getElementById("rev-save-block").style.display   = "";
    } catch (e) { toast("⚠ " + e.message); }
  });

  document.getElementById("rev-save-btn").addEventListener("click", async () => {
    const app = document.getElementById("rev-app").value.trim();
    const password = document.getElementById("rev-input").value;
    if (!app) { toast("Enter the app or service name."); return; }
    try {
      await api("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: app, password, app }),
      });
      toast("✓ Saved to DigiSafe");
      document.getElementById("rev-app").value = "";
    } catch (e) { toast("⚠ " + e.message); }
  });

  let vaultEntries = [];

  async function loadVault() {
    if (!isAuthenticated) {
      window.location.href = "/login";
      return;
    }
    const list = document.getElementById("vault-list");
    list.innerHTML = `<p class="vault-empty">Loading…</p>`;
    try {
      vaultEntries = await api("/api/passwords");
      if (!vaultEntries.length) {
        list.innerHTML = `<p class="vault-empty">No saved passwords yet.</p>`;
        return;
      }
      list.innerHTML = "";
      vaultEntries.forEach(e => {
        const entryEl = document.createElement("div");
        entryEl.className = "vault-entry";
        entryEl.id = `entry-${e.id}`;
        
        entryEl.innerHTML = `
          <div class="vault-entry-info">
            <div class="vault-entry-user">
              ${escHtml(currentUserEmail)} 
              <span class="vault-badge">${escHtml(e.app)}</span>
            </div>
            <div class="vault-entry-pwd" id="pwd-text-${e.id}">••••••••••••</div>
          </div>
          <button class="btn icon btn-toggle" title="Show/hide">👁</button>
          <button class="btn icon btn-copy" title="Copy">⎘</button>
          <button class="btn icon danger btn-delete" title="Delete">✕</button>
        `;

        let isVisible = false;
        const pwdTextEl = entryEl.querySelector(`#pwd-text-${e.id}`);

        entryEl.querySelector(".btn-toggle").addEventListener("click", () => {
          isVisible = !isVisible;
          pwdTextEl.textContent = isVisible ? e.password : "••••••••••••";
        });

        entryEl.querySelector(".btn-copy").addEventListener("click", () => {
          navigator.clipboard.writeText(e.password).then(() => toast("Copied to clipboard"));
        });

        entryEl.querySelector(".btn-delete").addEventListener("click", () => {
          deleteEntry(e.id);
        });

        list.appendChild(entryEl);
      });
    } catch (e) { 
      list.innerHTML = `<p class="vault-empty">Failed to load passwords.</p>`; 
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function deleteEntry(id) {
    try {
      await api(`/api/passwords/${id}`, { method: "DELETE" });
      document.getElementById("entry-" + id)?.remove();
      const list = document.getElementById("vault-list");
      if (!list.children.length)
        list.innerHTML = `<p class="vault-empty">No saved passwords yet.</p>`;
      toast("Entry deleted.");
    } catch (e) { toast("⚠ " + e.message); }
  }

  document.getElementById("vault-refresh-btn").addEventListener("click", loadVault);
</script>
