<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSphere - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #e3f2fd 0%, #f0f4f9 50%, #e8eef5 100%);
      color: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .card { width: 100%; max-width: 420px; background: #fff; border: 2px solid #d1d9e6; padding: 40px; border-radius: 16px; box-shadow: 0 16px 48px rgba(30, 144, 255, 0.2); }
    header { text-align: center; margin-bottom: 32px; }
    h1 {
      font-size: 2.2rem; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1e90ff, #4a90e2);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #6c757d; font-size: 0.9rem; font-weight: 500; }
    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 8px; }
    .field input { width: 100%; border: 2px solid #d1d9e6; background: #f8fbff; padding: 14px 18px; border-radius: 8px; outline: none; font-size: 1rem; transition: all 0.2s ease; }
    .field input:focus { border-color: #1e90ff; background: #fff; box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1); }
    .btn {
      width: 100%; padding: 16px; border: none; background: linear-gradient(135deg, #1e90ff, #4a90e2);
      color: #fff; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(30, 144, 255, 0.2);
    }
    .btn:hover { background: linear-gradient(135deg, #1a7fdb, #3d85d8); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(30, 144, 255, 0.3); }
    .btn:active { transform: translateY(0); }
    .btn.secondary { background: #fff; color: #1e90ff; border: 2px solid #1e90ff; margin-top: 12px; box-shadow: none; }
    .btn.secondary:hover { background: rgba(30, 144, 255, 0.05); border-color: #4a90e2; color: #4a90e2; }
    #msg { margin-bottom: 24px; min-height: 20px; font-size: 0.95rem; text-align: center; font-weight: 600; color: #ff4757; }
    #msg.success { color: #10b981; }
    @media (max-width: 480px) {
      .card { padding: 32px 24px; } h1 { font-size: 1.8rem; } .field input { padding: 12px 16px; font-size: 16px; } .btn { padding: 14px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>CyberSphere</h1>
      <p class="subtitle">Secure Credential Manager</p>
    </header>
    <div id="msg"></div>
    <form onsubmit="return false;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="button" class="btn" onclick="handleAuth('/api/login')">Log in</button>
      <button type="button" class="btn secondary" onclick="handleAuth('/api/signup')">Sign up</button>
    </form>
  </main>
  <script>
    const msg = document.getElementById('msg');
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');

    function showMsg(text, isSuccess = false) {
      msg.textContent = text;
      msg.className = isSuccess ? 'success' : '';
    }

    function clearSession() {
      localStorage.clear();
      sessionStorage.clear();
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          if (data?.loggedIn) { window.location.href = '/'; return true; }
        }
      } catch (e) { console.warn("Auth check failed", e); }
      return false;
    }

    async function handleAuth(path) {
      const email = emailEl.value.trim().toLowerCase();
      const password = passEl.value;
      if (!email || !password) return showMsg('Both email and password are required.');
      
      showMsg('');
      clearSession();
      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        const loggedIn = await checkAuth();
        if (!loggedIn) showMsg('Verification failed. Please try again.');
      } catch (err) { showMsg(err.message); }
    }

    checkAuth().then(ok => { if (!ok) clearSession(); });
  </script>
</body>
</html>
