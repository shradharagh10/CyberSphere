
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberSphere — Login</title>
  <style>
    :root {
      --bg-gradient:  linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --surface:      #1e293b;
      --surface-card: #0f172a;
      --border:       #334155;
      --border-focus: #6366f1;
      
      --accent:       #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow:  rgba(99, 102, 241, 0.25);
      
      --text:         #f8fafc;
      --muted:        #94a3b8;
      
      --mono:         'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace;
      --sans:         'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-family: var(--mono);
      font-size: 2.2rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
      font-weight: 800;
    }

    .subtitle { color: var(--muted); font-size: 0.9rem; font-weight: 500; }

    .field { margin-bottom: 1.25rem; }

    .field label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-card);
      color: var(--text);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
      font-family: var(--mono);
      transition: all 0.2s ease;
    }

    .field input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn.secondary {
      background: transparent;
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
      margin-top: 0.75rem;
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: var(--accent);
    }

    #msg {
      margin-bottom: 1.25rem;
      min-height: 20px;
      font-size: 0.88rem;
      text-align: center;
      font-weight: 600;
      color: #f43f5e;
    }

    #msg.success { color: #10b981; }

    @media (max-width: 480px) {
      .card { padding: 1.75rem 1.25rem; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <h1>CyberSphere</h1>
      <p class="subtitle">Secure Credential Manager</p>
    </header>
    <div id="msg"></div>
    <form onsubmit="event.preventDefault(); handleAuth('/api/login');">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn">Log in</button>
      <button type="button" class="btn secondary" onclick="handleAuth('/api/signup')">Sign up</button>
    </form>
  </main>
  <script>
    const msg = document.getElementById('msg');
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');

    function showMsg(text, isSuccess = false) {
      msg.textContent = text;
      msg.className = isSuccess ? 'success' : '';
    }

    function clearSession() {
      localStorage.clear();
      sessionStorage.clear();
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          if (data?.loggedIn) { window.location.href = '/'; return true; }
        }
      } catch (e) { console.warn("Auth check failed", e); }
      return false;
    }

    async function handleAuth(path) {
      const email = emailEl.value.trim().toLowerCase();
      const password = passEl.value;
      if (!email || !password) return showMsg('Both email and password are required.');
      
      showMsg('');
      clearSession();
      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        const loggedIn = await checkAuth();
        if (!loggedIn) showMsg('Verification failed. Please try again.');
      } catch (err) { showMsg(err.message); }
    }

    checkAuth().then(ok => { if (!ok) clearSession(); });
  </script>
</body>
</html>
